{% extends 'layout.html' %}
{% load static %}

{% block page_title %}Nuevo Remito{% endblock %}

{% block contenedor %}
<style>
    .remito-form-container {
        background: #222;
        color: #eee;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        padding: 2.5rem 2rem;
        max-width: 500px;
        margin: 40px auto;
    }
    .remito-form-container h2 {
        color: #ccc;
        margin-bottom: 1.5rem;
        text-align: center;
        font-weight: 600;
    }
    .remito-form-container label {
        color: #bbb;
        font-weight: 500;
    }
    .remito-form-container input,
    .remito-form-container select,
    .remito-form-container textarea {
        background: #333;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        margin-bottom: 1rem;
    }
    .remito-form-container .btn-primary {
        background: #111;
        border: none;
        color: #fff;
    }
    .remito-form-container .btn-primary:hover {
        background: #444;
    }
    .remito-form-container .btn-secondary {
        background: #555;
        border: none;
        color: #fff;
    }
    .remito-form-container .btn-secondary:hover {
        background: #333;
    }
    .remito-form-container form p {
        margin-bottom: 1.2rem;
    }
</style>

<div class="remito-form-container">
    <h2>Cargar Remito</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
